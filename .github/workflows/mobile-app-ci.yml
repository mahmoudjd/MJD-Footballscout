name: Mobile-App CI

on:
  pull_request:
    branches: [main]
    paths: ['mobile-app/**', '.github/workflows/mobile-app-ci.yml']
  push:
    branches: [main]
    paths: ['mobile-app/**', '.github/workflows/mobile-app-ci.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
