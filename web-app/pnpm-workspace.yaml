# pnpm 11 treats skipped dependency build scripts as a hard error. sharp and
# @tailwindcss/oxide ship prebuilt binaries, so their build scripts are
# intentionally not run — that must not fail the install.
strictDepBuilds: false
ignoredBuiltDependencies:
  - "@tailwindcss/oxide"
  - sharp

# Security: force patched transitive build deps (via next > styled-jsx > @babel/core).
overrides:
  browserslist: ">=4.28.7"
  baseline-browser-mapping: ">=2.11.0"
